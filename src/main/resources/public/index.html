<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Smart Route Analyzer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#1c2127",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        /* Map pattern overlay for visual context without loading heavy tiles */
        .map-pattern {
            background-color: #101922;
            background-image:
                linear-gradient(#1c2127 2px, transparent 2px),
                linear-gradient(90deg, #1c2127 2px, transparent 2px);
            background-size: 40px 40px;
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 0;
        }

        .hidden-modal {
            display: none;
        }

        .flex-modal {
            display: flex;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display overflow-hidden h-screen flex flex-col relative">

    <!-- Top Navigation Bar -->
    <header
        class="flex items-center justify-between px-4 py-3 bg-surface-light dark:bg-surface-dark border-b border-gray-200 dark:border-gray-800 z-20 shadow-sm relative shrink-0">
        <div class="flex items-center gap-3">
            <button
                class="flex items-center justify-center p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <span class="material-symbols-outlined text-gray-500 dark:text-gray-400">menu</span>
            </button>
            <h1 class="text-lg font-bold tracking-tight">Smart Route Analyzer</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="openReportModal()"
                class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors bg-red-500/10 text-red-500"
                title="Report Issue">
                <span class="material-symbols-outlined">report_problem</span>
            </button>
            <button onclick="openReviewModal()"
                class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors bg-yellow-500/10 text-yellow-500"
                title="Review Road">
                <span class="material-symbols-outlined">rate_review</span>
            </button>
        </div>
    </header>

    <!-- Map Container -->
    <div class="flex-1 relative w-full h-full overflow-hidden bg-background-dark">
        <div id="map"></div>

        <!-- Floating Input Card (Top Overlay) -->
        <div class="absolute top-4 left-4 right-4 z-[500]">
            <div
                class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-xl p-4 border border-gray-200 dark:border-gray-700 backdrop-blur-md bg-opacity-95 dark:bg-opacity-95">
                <div class="flex flex-col gap-3 relative">
                    <!-- Source Input -->
                    <div class="flex items-center gap-3 relative z-10">
                        <div class="w-8 h-8 flex items-center justify-center shrink-0">
                            <div class="w-4 h-4 rounded-full border-4 border-primary bg-white dark:bg-surface-dark">
                            </div>
                        </div>
                        <div class="flex-1">
                            <label
                                class="block text-[10px] font-bold uppercase text-gray-500 dark:text-gray-400 mb-0.5 tracking-wider">Source
                                Node</label>
                            <div class="relative">
                                <select id="sourceSelect"
                                    class="w-full bg-gray-50 dark:bg-[#101922] border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-primary focus:border-primary block p-2.5">
                                    <option>Loading...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <!-- Destination Input -->
                    <div class="flex items-center gap-3 relative z-10">
                        <div class="w-8 h-8 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-red-500 text-2xl">location_on</span>
                        </div>
                        <div class="flex-1">
                            <label
                                class="block text-[10px] font-bold uppercase text-gray-500 dark:text-gray-400 mb-0.5 tracking-wider">Destination
                                Node</label>
                            <div class="relative">
                                <select id="destSelect"
                                    class="w-full bg-gray-50 dark:bg-[#101922] border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-primary focus:border-primary block p-2.5">
                                    <option>Loading...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <button onclick="findPath()"
                    class="mt-4 w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">alt_route</span>
                    Find Optimal Path
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Sheet / Route Summary -->
    <div id="routeSummary"
        class="hidden bg-surface-light dark:bg-surface-dark border-t border-gray-200 dark:border-gray-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-20 shrink-0 pb-6 rounded-t-2xl transition-all">
        <div class="px-5 pt-4">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h2 class="text-xl font-bold text-gray-900 dark:text-white">Route Summary</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-green-500 inline-block"></span>
                        Optimal path calculated
                    </p>
                </div>
                <div class="text-right">
                    <span id="summaryDistance" class="block text-2xl font-bold text-primary">0 km</span>
                    <span id="summaryPath" class="text-sm font-medium text-gray-500 dark:text-gray-400">Path...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Report Modal -->
    <div id="reportModal"
        class="fixed inset-0 z-[1000] hidden bg-black/50 backdrop-blur-sm items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-[#101922] rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-800">
                <h2 class="text-xl font-bold dark:text-white">Report Road Issue</h2>
                <button onclick="closeReportModal()"
                    class="text-gray-500 hover:text-gray-700 dark:text-gray-400 transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Road Segment</label>
                    <select id="reportRoadSelect"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Issue Type</label>
                    <select id="reportType"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3">
                        <option value="pothole">Pothole</option>
                        <option value="construction">Under Construction</option>
                        <option value="accident">Accident</option>
                        <option value="flooded">Flooded</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Description</label>
                    <textarea id="reportDesc"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3"
                        rows="3"></textarea>
                </div>
                <button onclick="submitComplaint()"
                    class="w-full bg-primary text-white font-bold py-3 rounded-xl shadow-md">Submit Complaint</button>
            </div>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal"
        class="fixed inset-0 z-[1000] hidden bg-black/50 backdrop-blur-sm items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-[#101922] rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-800">
                <h2 class="text-xl font-bold dark:text-white">Rate Road</h2>
                <button onclick="closeReviewModal()"
                    class="text-gray-500 hover:text-gray-700 dark:text-gray-400 transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Road Segment</label>
                    <select id="reviewRoadSelect"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Rating (1-5)</label>
                    <select id="reviewRating"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3">
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Terrible</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Comment</label>
                    <textarea id="reviewComment"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3"
                        rows="3"></textarea>
                </div>
                <button onclick="submitReview()"
                    class="w-full bg-primary text-white font-bold py-3 rounded-xl shadow-md">Submit Review</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>

</body>

</html>
