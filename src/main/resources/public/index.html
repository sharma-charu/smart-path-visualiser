<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Smart Route Analyzer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#1c2127",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        #map {
            height: 100%;
            width: 100%;
            z-index: 0;
        }

        .autocomplete-container {
            position: relative;
        }

        .autocomplete-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e5e7eb;
            border-top: none;
            border-radius: 0 0 0.5rem 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .dark .autocomplete-suggestions {
            background: #1c2127;
            border-color: #374151;
        }

        .autocomplete-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }

        .dark .autocomplete-item {
            border-bottom-color: #374151;
        }

        .autocomplete-item:hover {
            background-color: #f3f4f6;
        }

        .dark .autocomplete-item:hover {
            background-color: #374151;
        }

        .autocomplete-item.selected {
            background-color: #dbeafe;
        }

        .dark .autocomplete-item.selected {
            background-color: #1e3a8a;
        }

        .path-layer {
            cursor: pointer;
        }

        .path-layer:hover {
            opacity: 0.8 !important;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display overflow-hidden h-screen flex flex-col relative">

    <!-- Top Navigation Bar -->
    <header
        class="flex items-center justify-between px-4 py-3 bg-surface-light dark:bg-surface-dark border-b border-gray-200 dark:border-gray-800 z-20 shadow-sm relative shrink-0">
        <div class="flex items-center gap-3">
            <button
                class="flex items-center justify-center p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <span class="material-symbols-outlined text-gray-500 dark:text-gray-400">menu</span>
            </button>
            <h1 class="text-lg font-bold tracking-tight">Smart Route Analyzer</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="openReportModal()"
                class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors bg-red-500/10 text-red-500"
                title="Report Issue">
                <span class="material-symbols-outlined">report_problem</span>
            </button>
            <button onclick="openReviewModal()"
                class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors bg-yellow-500/10 text-yellow-500"
                title="Review Road">
                <span class="material-symbols-outlined">rate_review</span>
            </button>
        </div>
    </header>

    <!-- Map Container -->
    <div class="flex-1 relative w-full h-full overflow-hidden bg-background-dark">
        <div id="map"></div>

        <!-- Floating Search Card -->
        <div class="absolute top-4 left-4 right-4 z-[500]">
            <div
                class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-xl p-4 border border-gray-200 dark:border-gray-700 backdrop-blur-md bg-opacity-95 dark:bg-opacity-95">
                <div class="flex flex-col gap-3 relative">
                    <!-- Source Autocomplete -->
                    <div class="flex items-center gap-3 relative z-10">
                        <div class="w-8 h-8 flex items-center justify-center shrink-0">
                            <div class="w-4 h-4 rounded-full border-4 border-primary bg-white dark:bg-surface-dark">
                            </div>
                        </div>
                        <div class="flex-1 autocomplete-container">
                            <label
                                class="block text-[10px] font-bold uppercase text-gray-500 dark:text-gray-400 mb-0.5 tracking-wider">Origin</label>
                            <input type="text" id="sourceInput" placeholder="Search for origin..."
                                autocomplete="off"
                                class="w-full bg-gray-50 dark:bg-[#101922] border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-primary focus:border-primary block p-2.5"
                                oninput="handleAutocomplete('source')"
                                onfocus="handleAutocomplete('source')"
                            />
                            <div id="source-suggestions" class="autocomplete-suggestions hidden"></div>
                        </div>
                    </div>
                    <!-- Destination Autocomplete -->
                    <div class="flex items-center gap-3 relative z-10">
                        <div class="w-8 h-8 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-red-500 text-2xl">location_on</span>
                        </div>
                        <div class="flex-1 autocomplete-container">
                            <label
                                class="block text-[10px] font-bold uppercase text-gray-500 dark:text-gray-400 mb-0.5 tracking-wider">Destination</label>
                            <input type="text" id="destInput" placeholder="Search for destination..."
                                autocomplete="off"
                                class="w-full bg-gray-50 dark:bg-[#101922] border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-primary focus:border-primary block p-2.5"
                                oninput="handleAutocomplete('dest')"
                                onfocus="handleAutocomplete('dest')"
                            />
                            <div id="dest-suggestions" class="autocomplete-suggestions hidden"></div>
                        </div>
                    </div>
                </div>
                <button onclick="findAllPaths()"
                    class="mt-4 w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">alt_route</span>
                    Find All Routes
                </button>
            </div>
        </div>

        <!-- Path Details Panel (Right Side) -->
        <div id="pathDetails"
            class="hidden absolute top-4 right-4 bottom-4 w-80 bg-surface-light dark:bg-surface-dark rounded-xl shadow-xl p-4 border border-gray-200 dark:border-gray-700 overflow-y-auto z-[400]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Path Details</h3>
                <button onclick="closePathDetails()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="pathDetailsContent"></div>
        </div>
    </div>

    <!-- Bottom Sheet / Route Summary -->
    <div id="routeSummary"
        class="hidden bg-surface-light dark:bg-surface-dark border-t border-gray-200 dark:border-gray-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-20 shrink-0 pb-6 rounded-t-2xl transition-all max-h-[40vh] overflow-y-auto">
        <div class="px-5 pt-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-900 dark:text-white">Available Routes</h2>
                <button onclick="document.getElementById('routeSummary').classList.add('hidden')"
                    class="text-gray-500 hover:text-gray-700 dark:text-gray-400">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="routeList" class="space-y-2"></div>
        </div>
    </div>

    <!-- Report Modal -->
    <div id="reportModal"
        class="fixed inset-0 z-[1000] hidden bg-black/50 backdrop-blur-sm items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-[#101922] rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-800">
                <h2 class="text-xl font-bold dark:text-white">Report Road Issue</h2>
                <button onclick="closeReportModal()"
                    class="text-gray-500 hover:text-gray-700 dark:text-gray-400 transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Road Segment</label>
                    <select id="reportRoadSelect"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Issue Type</label>
                    <select id="reportType"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3">
                        <option value="pothole">Pothole</option>
                        <option value="construction">Under Construction</option>
                        <option value="accident">Accident</option>
                        <option value="flooded">Flooded</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Description</label>
                    <textarea id="reportDesc"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3"
                        rows="3"></textarea>
                </div>
                <button onclick="submitComplaint()"
                    class="w-full bg-primary text-white font-bold py-3 rounded-xl shadow-md">Submit Complaint</button>
            </div>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal"
        class="fixed inset-0 z-[1000] hidden bg-black/50 backdrop-blur-sm items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-[#101922] rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-800">
                <h2 class="text-xl font-bold dark:text-white">Rate Road</h2>
                <button onclick="closeReviewModal()"
                    class="text-gray-500 hover:text-gray-700 dark:text-gray-400 transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Road Segment</label>
                    <select id="reviewRoadSelect"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3"></select>
                </div>
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Rating (1-5)</label>
                    <select id="reviewRating"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3">
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Terrible</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium dark:text-white mb-2">Comment</label>
                    <textarea id="reviewComment"
                        class="w-full rounded-xl bg-gray-50 dark:bg-gray-800 border-gray-300 dark:border-gray-700 dark:text-white p-3"
                        rows="3"></textarea>
                </div>
                <button onclick="submitReview()"
                    class="w-full bg-primary text-white font-bold py-3 rounded-xl shadow-md">Submit Review</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>

</body>

</html>
